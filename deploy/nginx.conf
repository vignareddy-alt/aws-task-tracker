# Nginx site config for the Task Tracker on EC2 (Ubuntu).
# Copy to /etc/nginx/sites-available/task-tracker and enable it (see README).
#
#  - Serves the built React app from /var/www/task-tracker
#  - Proxies /api/* to the Express backend on 127.0.0.1:5000 (managed by PM2)

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or keep "_" to answer on the EC2 public IP.
    server_name _;

    root /var/www/task-tracker;
    index index.html;

    # Basic hardening
    server_tokens off;
    client_max_body_size 1m;

    # Compress text responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Backend API -> Express on port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite puts hashed files in /assets, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: send every unknown path to index.html so that
    # refreshing /tasks/5 loads the app instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
